name: azurekiln-link

services:
  app:
    image: "${APP_IMAGE:-ghcr.io/azurekiln2333/azurekiln-shortlink:latest}"
    restart: unless-stopped
    init: true
    # Bridge network stays default; host-gateway mapping lets the container
    # reach MySQL on the host via SHORTNY_DB_HOST=host.docker.internal
    # (Docker Engine >= 20.10). The host MySQL must listen beyond 127.0.0.1
    # and its user must be granted access from the Docker bridge subnet.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Set APP_INSTALL_LOCK=1 in .env once the installer has run.
      APP_INSTALL_LOCK: "${APP_INSTALL_LOCK:-0}"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-azurekiln-link}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-azurekiln-link}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Needed only while the GHCR image is private:
      # - ~/.docker/config.json:/.docker/config.json:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-azurekiln-link}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
